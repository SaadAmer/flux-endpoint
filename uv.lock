requires-dist = [
    { name = "accelerate", marker = "extra == 'worker'", specifier = ">=1.14" },
    { name = "diffusers", marker = "extra == 'worker'", specifier = ">=0.40" },
    { name = "httpx", marker = "extra == 'client'", specifier = ">=0.28" },
    { name = "pillow", marker = "extra == 'worker'", specifier = ">=12.2" },
    { name = "pydantic", specifier = ">=2.13" },
    { name = "runpod", marker = "extra == 'worker'", specifier = ">=1.12" },
    { name = "torch", marker = "extra == 'worker'", specifier = ">=2.13" },
    { name = "transformers", marker = "extra == 'worker'", specifier = ">=5.17" },
    { name = "typer", marker = "extra == 'client'", specifier = ">=0.25" },
]
provides-extras = ["worker", "client"]

[package.metadata.requires-dev]
dev = [
    { name = "flake8", specifier = ">=7.3" },
    { name = "mypy", specifier = ">=2.3" },
