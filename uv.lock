    { name = "httpx" },
    { name = "typer" },
]
worker = [
    { name = "accelerate" },
    { name = "diffusers" },
    { name = "pillow" },
    { name = "runpod" },
    { name = "torch" },
    { name = "transformers" },
]

[package.dev-dependencies]
