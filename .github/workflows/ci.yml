name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.10"
      - name: Install
        run: uv sync --frozen --all-extras
      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: |
          uv run ruff check .
          uv run flake8
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing
      - name: Audit dependencies
        run: |
          uv export --frozen --all-extras --all-groups --no-emit-project --quiet \
            --format requirements-txt | uv run pip-audit --disable-pip --requirement /dev/stdin
