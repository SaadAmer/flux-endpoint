<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 412" width="1000" height="412" role="img">
  <style>
    svg { --surface: #ffffff; --canvas: #f7f8fa; --ink: #15181e; --muted: #555e6c; --line: #a7aeb9; --build: #a6520a; --build-tint: #fcf1e6; --deploy: #0b6e66; --deploy-tint: #e5f4f2; --run: #5a3ec8; --run-tint: #efebfc; --danger: #b3261e; --danger-tint: #fdecea; --phase: #5a3ec8; --phase-tint: #efebfc; }
    @media (prefers-color-scheme: dark) { svg { --surface: #161a21; --canvas: #0e1116; --ink: #e7eaf0; --muted: #9ba4b3; --line: #4f5866; --build: #f2a65a; --build-tint: #2a1e12; --deploy: #4cc9bb; --deploy-tint: #0f2624; --run: #ad9bff; --run-tint: #1e1934; --danger: #ff8f86; --danger-tint: #2e1716; --phase: #ad9bff; --phase-tint: #1e1934; } }
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .canvas { fill: var(--canvas); }
    .box { fill: var(--surface); stroke: var(--line); stroke-width: 1.25; }
    .box.phase { fill: var(--phase-tint); stroke: var(--phase); }
    .box.danger { fill: var(--danger-tint); stroke: var(--danger); }
    .zone { fill: none; stroke: var(--line); stroke-width: 1.25; stroke-dasharray: 5 5; }
    .t-title { font-size: 15px; font-weight: 600; fill: var(--ink); }
    .t-line { font-size: 13px; fill: var(--muted); }
    .t-mono, .t-zone, .t-label { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .t-mono { font-size: 12.5px; fill: var(--muted); }
    .t-zone { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; fill: var(--muted); }
    .t-label { font-size: 11.5px; font-weight: 500; fill: var(--phase); }
    .t-step { font-weight: 700; }
    .t-danger { fill: var(--danger); }
    .edge { fill: none; stroke: var(--phase); stroke-width: 1.75; }
    .edge.optional { stroke-dasharray: 6 5; }
    .edge.danger { stroke: var(--danger); }
    .head-phase { fill: var(--phase); }
    .head-danger { fill: var(--danger); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-phase" d="M0 1 L10 5 L0 9 Z"/></marker>
    <marker id="arrow-danger" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="head-danger" d="M0 1 L10 5 L0 9 Z"/></marker>
  </defs>
  <rect class="canvas" width="1000" height="412" rx="12"/>
              <title>Run stage</title>
              <desc>The client posts a job to the Runpod job API. The job waits in the queue until a GPU worker takes it. The worker returns the result to the job API, and the client reads it with a status call. With a bucket, the worker uploads the image and the client downloads it over https.</desc>

              <rect class="box" x="804" y="16" width="148" height="36" rx="18"/>
              <text class="t-line" x="878" y="39" text-anchor="middle">Docker Hub image</text>

              <rect class="zone" x="278" y="84" width="712" height="216" rx="14"/>
              <text class="t-zone" x="296" y="104">RUNPOD SERVERLESS</text>

              <rect class="box" x="24" y="120" width="164" height="110" rx="10"/>
              <text class="t-title" x="40" y="148">Client</text>
              <text class="t-mono" x="40" y="172">flux-endpoint CLI</text>
              <text class="t-line" x="40" y="194">or any HTTP client</text>

              <rect class="box" x="294" y="120" width="180" height="110" rx="10"/>
              <text class="t-title" x="310" y="148">Runpod job API</text>
              <text class="t-mono" x="310" y="172">api.runpod.ai</text>
              <text class="t-line" x="310" y="194">results kept 30 min</text>

              <rect class="box" x="554" y="120" width="150" height="110" rx="10"/>
              <text class="t-title" x="570" y="148">Queue</text>
              <text class="t-line" x="570" y="172">scaler adds a</text>
              <text class="t-line" x="570" y="194">worker after 4 s</text>

              <rect class="box" x="794" y="98" width="182" height="120" rx="10"/>
              <rect class="box phase" x="780" y="112" width="182" height="120" rx="10"/>
              <text class="t-title" x="796" y="140">GPU worker</text>
              <text class="t-mono" x="796" y="164">handler.py</text>
              <text class="t-line" x="796" y="186">FLUX.1-dev in bf16</text>
              <text class="t-line" x="796" y="208">0 to 2 workers</text>

              <rect class="box" x="780" y="318" width="182" height="80" rx="10"/>
              <text class="t-title" x="796" y="344">Bucket (optional)</text>
              <text class="t-line" x="796" y="366">S3 or R2</text>
              <text class="t-line" x="796" y="386">URL valid 7 days</text>

              <path class="edge" d="M188 150 H290" marker-end="url(#arrow)"/>
              <text class="t-label" x="232" y="140" text-anchor="middle"><tspan class="t-step">1</tspan><tspan dx="6">POST /run</tspan></text>
              <path class="edge" d="M474 175 H550" marker-end="url(#arrow)"/>
              <text class="t-label" x="514" y="165" text-anchor="middle"><tspan class="t-step">2</tspan><tspan dx="6">queue</tspan></text>
              <path class="edge" d="M704 175 H776" marker-end="url(#arrow)"/>
              <text class="t-label" x="740" y="165" text-anchor="middle"><tspan class="t-step">3</tspan><tspan dx="6">job</tspan></text>
              <path class="edge" d="M810 232 V284 H384 V234" marker-end="url(#arrow)"/>
              <text class="t-label" x="597" y="276" text-anchor="middle"><tspan class="t-step">4</tspan><tspan dx="6">result: image or URL</tspan></text>
              <path class="edge" d="M294 204 H192" marker-end="url(#arrow)"/>
              <text class="t-label" x="232" y="222" text-anchor="middle"><tspan class="t-step">5</tspan><tspan dx="6">/status</tspan></text>
              <path class="edge optional" d="M920 232 V314" marker-end="url(#arrow)"/>
              <text class="t-label" x="930" y="278">upload</text>
              <path class="edge optional" d="M780 370 H106 V234" marker-end="url(#arrow)"/>
              <text class="t-label" x="447" y="362" text-anchor="middle"><tspan class="t-step">6</tspan><tspan dx="6">download over https</tspan></text>
              <path class="edge optional" d="M878 52 V94" marker-end="url(#arrow)"/>
              <text class="t-label" x="866" y="72" text-anchor="end">pull on cold start</text>
            </svg>
